<!DOCTYPE html>
<html>
<head>
    <title>Medical Insurance Price Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f2f2f2;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>

</head>

<body>

<div class="container">
    <h2>Insurance Price Predictor</h2>

    <label>Age</label>
    <input id="age" type="number">

    <label>BMI</label>
    <input id="bmi" type="number" step="0.1">

    <label>Children</label>
    <input id="children" type="number">

    <label>Smoker (1=yes, 0=no)</label>
    <input id="smoker" type="number">

    <label>Region</label>
    <input id="region" type="number">

    <button onclick="predict()">Predict Price</button>

    <div id="result"></div>
</div>

<script>
    async function predict() {
        const data = {
            age: Number(document.getElementById("age").value),
            bmi: Number(document.getElementById("bmi").value),
            children: Number(document.getElementById("children").value),
            smoker: Number(document.getElementById("smoker").value),
            region: Number(document.getElementById("region").value)
        };

        const response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({data: data})
        });

        const result = await response.json();

        document.getElementById("result").innerHTML =
            "Predicted Price: ₹ " + result.predicted_price.toFixed(2);
    }
</script>

</body>
</html>
