<!DOCTYPE html>
<html>
<head>
  <title>Insurance Price Predictor</title>
</head>
<body>
  <h1>Insurance Price Predictor</h1>
  <form id="predictForm">
    Age: <input type="number" id="age" required><br>
    BMI: <input type="number" step="0.1" id="bmi" required><br>
    Children: <input type="number" id="children" required><br>
    Smoker (0 = No, 1 = Yes): <input type="number" id="smoker" required><br>
    <button type="submit">Predict</button>
  </form>

  <h2 id="result"></h2>

  <script>
    document.getElementById("predictForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        age: parseInt(document.getElementById("age").value),
        bmi: parseFloat(document.getElementById("bmi").value),
        children: parseInt(document.getElementById("children").value),
        smoker: parseInt(document.getElementById("smoker").value)
      };

      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data })
      });

      const result = await response.json();
      document.getElementById("result").innerText = "Predicted Price: " + result.predicted_price;
    });
  </script>
</body>
</html>
